[project]
name = "crm-agent-demo"
version = "0.1.0"
description = "Minimal multi-agent customer service demo (Gemini, SQLite)"
requires-python = ">=3.13"
dependencies = ["sanic", "msgspec", "aiohttp"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "sanic-testing"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
